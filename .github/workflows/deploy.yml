name: Deploy to GitHub Pages + Firebase Hosting

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *' # 每小時同步一次 Notion，讓老師只改 Notion 也能自動更新網站
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: node scripts/sync-notion.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_STUDENTS_DB_ID: ${{ secrets.NOTION_STUDENTS_DB_ID }}

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # 主要托管：GitHub Pages
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 備援托管：Firebase Hosting，同一份 build 產物，跟 GitHub Pages 互相獨立
  # 就算之後 GitHub repo 轉 private 導致 GitHub Pages 失效，Actions 仍會繼續跑，這條線不受影響
  deploy-firebase:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: snakegame-91f56
          channelId: live
