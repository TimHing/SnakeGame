<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnakeG — 學習貪吃蛇</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="login-view" class="view">
    <div class="login-box">
      <h1>🐍 SnakeG</h1>
      <p class="muted">選你自己的暱稱開始玩</p>
      <div class="rollcall-filters">
        <label>年級<select id="rollcall-grade"></select></label>
        <label>科目<select id="rollcall-subject"></select></label>
      </div>
      <div id="rollcall-list" class="rollcall-list"></div>
      <p id="rollcall-empty" class="muted hidden">這個年級/科目還沒有學生名單，請聯絡老師在 Notion 裡新增。</p>
    </div>
  </div>

  <div id="game-view" class="view hidden">
    <div id="hud">
      <img class="avatar-icon" src="%BASE_URL%assets/avatar-default.svg" alt="" />
      <div id="my-score">分數：<span id="score-value">0</span></div>
      <button id="game-logout-btn" class="secondary">結束遊玩</button>
    </div>
    <div id="game-body">
      <div id="phaser-container"></div>
    </div>
  </div>

  <div id="question-modal" class="modal hidden">
    <div class="modal-box">
      <p id="question-text"></p>
      <div id="question-choices"></div>
      <p id="question-feedback"></p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
