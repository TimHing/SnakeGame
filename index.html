<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnakeG — 學習貪吃蛇</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="login-view" class="view">
    <div class="login-box">
      <h1>🐍 SnakeG</h1>
      <p class="muted">選你自己的名字開始玩</p>
      <div id="rollcall-list" class="rollcall-list"></div>
      <p id="rollcall-empty" class="muted hidden">還沒有學生名單，請到 Notion 裡新增。</p>
    </div>
  </div>

  <div id="game-view" class="view hidden">
    <div id="hud">
      <img class="avatar-icon" src="%BASE_URL%assets/avatar-default.svg" alt="" />
      <div id="my-score">分數：<span id="score-value">0</span></div>
      <button id="game-logout-btn" class="secondary">結束遊玩</button>
    </div>
    <div id="game-body">
      <div id="phaser-container"></div>
      <aside id="leaderboard">
        <div class="lb-section">
          <h3>累積總分</h3>
          <ol id="total-leaderboard-list"></ol>
        </div>
        <div class="lb-section">
          <h3>單次最高分 Top 20</h3>
          <ol id="high-score-list"></ol>
        </div>
      </aside>
    </div>

    <div id="dpad">
      <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="上">▲</button>
      <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="左">◀</button>
      <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="右">▶</button>
      <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="下">▼</button>
    </div>
  </div>

  <div id="question-modal" class="modal hidden">
    <div class="modal-box">
      <p id="question-text"></p>
      <div id="question-choices"></div>
      <p id="question-feedback"></p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
